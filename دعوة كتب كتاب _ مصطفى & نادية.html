<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعوة كتب كتاب | مصطفى & نادية</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#f3d38a;--rose:#ff8fa8;--ink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Amiri','Traditional Arabic',serif;color:var(--ink);background:#2a0610;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;background:linear-gradient(120deg,#2a0610,#4a0a1c,#6b1128,#3a0818,#55102a,#2a0610);background-size:400% 400%;animation:flow 14s ease infinite}
@keyframes flow{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.glow{position:fixed;border-radius:50%;filter:blur(60px);opacity:.28;z-index:0;animation:float 9s ease-in-out infinite}
.g1{width:260px;height:260px;background:#ffd27a;top:-60px;right:-60px}
.g2{width:300px;height:300px;background:#b3264b;bottom:-80px;left:-80px;animation-delay:-4s}
@keyframes float{50%{transform:translate(30px,40px) scale(1.15)}}
canvas{position:fixed;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}

/* intro */
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,#5e1226,#240509);transition:opacity .9s,transform .9s,visibility .9s}
#intro.hide{opacity:0;transform:scale(1.15);visibility:hidden}
.seal{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font-size:72px;background:radial-gradient(circle at 35% 30%,#ffe9a8,#e2a93b);box-shadow:0 0 0 8px rgba(255,255,255,.15),0 0 60px rgba(255,210,122,.8);animation:beat 1.4s ease-in-out infinite;cursor:pointer;border:0}
@keyframes beat{50%{transform:scale(1.1)}}
#intro h2{font-family:'Aref Ruqaa',serif;font-size:2rem;margin:28px 0 6px;color:var(--gold)}
#intro p{margin:0;font-size:1.15rem;opacity:.9}
.tap{margin-top:22px;font-size:1rem;opacity:.85;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.3}}

/* card */
main{position:relative;z-index:5;min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.card{width:100%;max-width:460px;text-align:center;padding:38px 24px 32px;border-radius:28px;background:rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.35);box-shadow:0 20px 60px rgba(0,0,0,.35);opacity:0;transform:translateY(30px) scale(.96);transition:all 1.1s .3s}
.show .card{opacity:1;transform:none}
.card>*{opacity:0;transform:translateY(16px);animation:none}
.show .card>*{animation:rise .9s forwards}
.show .card>*:nth-child(1){animation-delay:.6s}.show .card>*:nth-child(2){animation-delay:.9s}
.show .card>*:nth-child(3){animation-delay:1.2s}.show .card>*:nth-child(4){animation-delay:1.5s}
.show .card>*:nth-child(5){animation-delay:1.8s}.show .card>*:nth-child(6){animation-delay:2.1s}
.show .card>*:nth-child(7){animation-delay:2.4s}
@keyframes rise{to{opacity:1;transform:none}}
.bism{font-size:1.15rem;color:var(--gold)}
.lead{font-size:1.2rem;margin:14px 0 4px;opacity:.95}
.title{font-family:'Aref Ruqaa',serif;font-size:2.5rem;color:var(--gold);margin:6px 0 18px;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.names{font-family:'Aref Ruqaa',serif;font-size:2.1rem;line-height:1.5;margin:6px 0}
.names .and{display:block;font-size:2.4rem;color:var(--rose);animation:beat 1.6s infinite}
.divider{margin:18px auto;width:70%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.msg{font-size:1.2rem;line-height:1.9;margin:0 0 20px}
.loc{margin-top:6px;padding:20px 14px;border-radius:20px;background:rgba(0,0,0,.22);border:1px dashed rgba(243,211,138,.7)}
.loc b{display:block;font-size:1.35rem;color:var(--gold);margin-bottom:6px}
.loc span{font-size:1.05rem;opacity:.9}
.btn{display:inline-block;margin-top:14px;padding:13px 30px;border-radius:999px;background:linear-gradient(135deg,#ffe29a,#e9a93d);color:#4a0d3a;font-weight:700;font-size:1.15rem;text-decoration:none;font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:transform .2s}
.btn:active{transform:scale(.96)}
.show .card>*:nth-child(8){animation-delay:2.7s}.show .card>*:nth-child(9){animation-delay:3s}
.date{margin:0 0 18px;padding:14px 10px;border-radius:18px;background:rgba(0,0,0,.2);border:1px solid rgba(243,211,138,.5)}
.date small{display:block;font-size:1.05rem;opacity:.9}
.date b{display:block;font-family:'Aref Ruqaa',serif;font-size:1.9rem;color:var(--gold);margin-top:4px}
.foot{margin-top:22px;font-size:1.1rem;color:var(--gold)}
@media (prefers-reduced-motion:reduce){.bg,.glow,.seal,.names .and{animation:none}}
</style>
</head>
<body>
<div class="bg"></div><div class="glow g1"></div><div class="glow g2"></div>
<canvas id="c"></canvas>

<div id="intro">
  <button class="seal" id="open" aria-label="افتح الدعوة">💍</button>
  <h2 dir="ltr" style="font-size:2.6rem;letter-spacing:4px">M ❤️ N</h2>
  <p>معزومين على فرحتنا ✨</p>
  <div class="tap">اضغط لفتح الدعوة</div>
</div>

<main id="main">
  <section class="card">
    <div class="bism">﷽</div>
    <div class="lead">يتشرف ويسعد</div>
    <div class="title">بدعوتكم لحضور كتب الكتاب</div>
    <div class="names">مصطفى السويدي<span class="and">♥</span>نادية مهني</div>
    <div class="divider"></div>
    <p class="msg">بحضوركم تكتمل فرحتنا<br>وبدعواتكم تتم سعادتنا 🤍</p>
    <div class="date"><small>📅 ميعاد كتب الكتاب</small><b>السبت 21 / 11 / 2026</b></div>
    <div class="loc">
      <b>📍 مكان كتب الكتاب</b>
      <span>اضغط على الزر لفتح الموقع على الخريطة</span><br>
      <a class="btn" href="https://maps.app.goo.gl/BTvShDYuzLCm61Kk6?g_st=iw" target="_blank" rel="noopener">افتح اللوكيشن</a>
    </div>
    <div class="foot">في انتظاركم ♡</div>
  </section>
</main>

<script>
(function(){
var cv=document.getElementById('c'),x=cv.getContext('2d'),W,H,dpr=Math.min(window.devicePixelRatio||1,2);
function rs(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
rs();addEventListener('resize',rs);
var sym=['♥','✦','❀','✧','♡'],cols=['#ffd27a','#ffb3c6','#fff','#ff8fa8','#ffe9a8'];
var P=[],C=[];
function mk(){return{x:Math.random()*W,y:H+20,s:10+Math.random()*18,v:.4+Math.random()*1.1,d:Math.random()*6,a:.3+Math.random()*.6,t:sym[Math.random()*sym.length|0],c:cols[Math.random()*cols.length|0]}}
for(var i=0;i<34;i++){var p=mk();p.y=Math.random()*H;P.push(p)}
function burst(){
  for(var i=0;i<140;i++){var a=Math.random()*Math.PI*2,sp=4+Math.random()*9;
    C.push({x:W/2,y:H/2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-4,w:6+Math.random()*6,h:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0],l:1})}
}
function loop(){
  x.clearRect(0,0,W,H);
  P.forEach(function(p,i){p.y-=p.v;p.d+=.02;p.x+=Math.sin(p.d)*.6;if(p.y<-30)P[i]=mk();
    x.globalAlpha=p.a;x.fillStyle=p.c;x.font=p.s+'px serif';x.fillText(p.t,p.x,p.y)});
  C.forEach(function(c){c.vy+=.22;c.vx*=.99;c.x+=c.vx;c.y+=c.vy;c.r+=c.vr;c.l-=.008;
    x.save();x.globalAlpha=Math.max(c.l,0);x.translate(c.x,c.y);x.rotate(c.r);x.fillStyle=c.c;x.fillRect(-c.w/2,-c.h/2,c.w,c.h);x.restore()});
  C=C.filter(function(c){return c.l>0&&c.y<H+40});
  requestAnimationFrame(loop);
}
loop();
var intro=document.getElementById('intro'),main=document.getElementById('main');
function openIt(){
  if(intro.classList.contains('hide'))return;
  intro.classList.add('hide');main.classList.add('show');
  burst();setTimeout(burst,500);setTimeout(burst,1100);
  try{if(navigator.vibrate)navigator.vibrate(60)}catch(e){}
}
intro.addEventListener('click',openIt);
})();
</script>
</body>
</html>
